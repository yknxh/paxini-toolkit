[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paxkit"
version = "0.1.0"
description = "Unofficial tools for Paxini Gen3 tactile sensors (PXSR replacement + force gauge testing)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    # 3.x DLLs are blocked by Windows Smart App Control (unsigned/no reputation; 3.0.6 confirmed on this PC 2026-10-05). 2.2.3 passes
    "pandas>=2.2,<2.3",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
paxkit = "paxkit.gui.app:main"

[project.scripts]
paxkit-cli = "paxkit.cli:main"

[tool.setuptools.packages.find]
include = ["paxkit*"]

[tool.setuptools.package-data]
# Sensor point models (extracted from PXSR) and gauge test zone definitions
paxkit = ["device/geometry/*.json", "bench/zones/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
