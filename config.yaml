# paxkit 설정. 상대경로는 이 파일 기준.

# ── Paxini 센서 ───────────────────────────────────────────────────
# baudrate는 PXSR 코드에 고정된 값(USB·HAND 921600)을 코드에서 쓰므로 여기서 바꾸지 않는다.
device:
  mode: usb                # usb (센서 1개 직결) | hand (손 보드, 미구현)
  port: ""                 # 비우면 CH343 포트를 자동 선택. 예: COM3, /dev/ttyUSB0

sensor_types:
  A:
    model: S1813E
    taxels: 31
    rated_N: 25
  B:
    model: S2015E
    taxels: 52
    rated_N: 25

# ── Force gauge (ZP-500N, 시리얼) — paxtest config.yaml 실측값 그대로 ──
gauge:
  port: COM7               # FTDI USB Serial Port (2026-09-29 확인)
  baudrate: 2400           # 실측. 8N1
  mode: stream             # poll: 명령 보내고 응답 읽기 | stream: 게이지가 연속 송신 (실측: 약 10 Hz)
  poll_command: "D\r"      # poll 모드에서만 사용
  poll_hz: 50
  line_terminator: ""      # 실측: 구분자 없음 ("0000.0-000.3-004.9...") → record_regex 로 자른다
  # 레코드 한 개. N 단위 실측은 고정폭 6글자, 첫 글자가 부호 자리('-' 또는 '0'), 소수 1자리.
  # 게이지 단위를 kgf 로 바꾸면 "-00.00" 형식이 되므로 "[-+ \\d]\\d{2}\\.\\d{2}" 로 바꾼다.
  record_regex: "[-+ \\d]\\d{3}\\.\\d"
  record_len: 6            # 레코드 글자 수. 버퍼 끝의 레코드가 이 길이면 다음 레코드를 기다리지 않고 바로 쓴다
  line_regex: "([-+]?\\d+(?:\\.\\d+)?)"   # 응답에서 숫자 추출 (첫 그룹)
  unit_scale: 1.0          # 게이지 단위 → N (kgf면 9.80665). 게이지 표시 단위는 N 으로 설정해 둠
  invert: true             # 압축(누름)이 + 가 되도록. 실측: 누르면 '-' 로 온다
  timeout_s: 0.2
  accuracy_N: 0.1          # ± 정확도 (참고). 실측: 0.5 kg 분동 → 4.9 N (기준 4.90 N), 분해능 0.1 N 이내

# ── 게이지 테스트 (bench, 계획 P6-4) — 값은 초안, 실기 데이터로 조정 ──
# 세션마다 meta.json에 복사되고, 재분석은 기본으로 그 값을 쓴다.
bench:
  max_N: 15                 # 안내 범위·힘 막대 경고선
  contact_N: 0.5            # 접촉 판정 (게이지)
  noload_N: 0.2             # 무부하 판정 (게이지)
  noload_warn_N: 0.3        # 무부하 확인 경고
  noload_check_s: 3.0       # 무부하 확인 시간
  stable_window_s: 0.2      # 안정 판정: ± 이 시간 안의 기울기
  stable_slope_N_per_s: 2.0
  max_gap_s: 0.1            # 짝짓기 보간 허용 간격 (센서 앞뒤 프레임)
  gauge_max_N: 100          # 게이지 이상값 제외
  min_taxel_sum: 5          # raw, 이보다 작으면 위치 없음
  bin_N: 1.0                # 오차 그래프 구간
  zone_min_samples: 20      # 구역 "충분" 판정 (안정 샘플 수)
  lag_warn_s: 0.1           # |지연|이 이보다 크면 경고 (진단값, 보정하지 않음)
  simultaneous_ratio: 0.5   # HAND 동시 접촉 판정
  hand_order: [A1, A2, B1, B2]   # HAND 누르는 순서. 라벨 ↔ 채널·슬롯은 P1b 후 추가
