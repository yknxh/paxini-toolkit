# paxkit settings. Relative paths are relative to this file.

# ── Paxini sensor ───────────────────────────────────────────────────
# baudrate is the value fixed in PXSR code (USB/HAND 921600), used from code, so it is not set here.
device:
  mode: usb                # usb (single sensor, direct) | hand (hand board, not implemented)
  port: ""                 # empty = auto-select the CH343 port. e.g. COM3, /dev/ttyUSB0
  stall_s: 1.0             # no frame for longer than this → stall alert + stop recording (not in PXSR; no re-request)

sensor_types:
  A:
    model: S1813E
    taxels: 31
    rated_N: 25
  B:
    model: S2015E
    taxels: 52
    rated_N: 25

# ── Force gauge (ZP-500N, serial) — measured values from paxtest config.yaml as-is ──
gauge:
  port: COM7               # FTDI USB Serial Port (confirmed 2026-09-29)
  baudrate: 2400           # measured. 8N1
  mode: stream             # poll: send a command, read the response | stream: gauge sends continuously (measured: ~10 Hz)
  poll_command: "D\r"      # poll mode only
  poll_hz: 50
  line_terminator: ""      # measured: no delimiter ("0000.0-000.3-004.9...") → split with record_regex
  # One record. Measured in N: fixed width 6 chars, first char is the sign position ('-' or '0'), 1 decimal place.
  # If the gauge unit is set to kgf, the format becomes "-00.00", so change this to "[-+ \\d]\\d{2}\\.\\d{2}".
  record_regex: "[-+ \\d]\\d{3}\\.\\d"
  record_len: 6            # record length (chars). A record of this length at the buffer end is used right away without waiting for the next one
  line_regex: "([-+]?\\d+(?:\\.\\d+)?)"   # extracts the number from the response (first group)
  unit_scale: 1.0          # gauge unit → N (9.80665 for kgf). The gauge display unit is set to N
  invert: true             # so that compression (pressing) is +. Measured: pressing arrives as '-'
  timeout_s: 0.2
  # fixed latency (s) subtracted from the receive time. Record transmission time (6 bytes = 25 ms) is subtracted separately in code.
  # 0.025 = measured lag (sensor−gauge) −50 ms (2026-10-05, before correction) − 25 ms transmission. To re-measure: tools/gauge_live_check.py --sensor
  latency_s: 0.025
  accuracy_N: 0.1          # ± accuracy (reference). Measured: 0.5 kg weight → 4.9 N (expected 4.90 N), within the 0.1 N resolution

# ── Gauge test (bench, plan P6-4) — draft values, to be tuned with real data ──
# Copied into meta.json for each session; re-analysis uses those values by default.
bench:
  max_N: 15                 # guidance range, force bar warning line
  contact_N: 1.0            # contact threshold (gauge); points below this are not counted (user decision 2026-10-06, was 0.5)
  noload_N: 0.2             # no-load threshold (gauge)
  noload_warn_N: 0.3        # no-load check warning
  noload_check_s: 3.0       # no-load check duration (before the test, and after it: Stop → hands off → stop)
  end_residual_min_s: 1.0   # residual at the end of the recording = trailing no-load run of at least this (s)
  stable_window_s: 0.2      # stability: slope within ± this time
  stable_slope_N_per_s: 2.0
  max_gap_s: 0.1            # max interpolation gap for pairing (sensor frames before/after)
  gauge_max_N: 100          # exclude gauge outliers
  bin_N: 1.0                # error plot bin
  pct_min_N: 1.0            # per test point: stable samples with gauge ≥ this → mean |e|/gauge % (main), reference gain fit
  point_min_samples: 10     # test point "enough" threshold (samples in its error %); fewer → left out of the maps
  point_min_range_N: 5.0    # warn if a point was pressed only below this
  err_levels: [5, 10, 20, 30]   # error map: contours at these mean |e| % values; usable = mean |e| % < k (user decision 2026-10-07)
  lag_warn_s: 0.1           # warn if the remaining |lag| exceeds this (time to re-measure gauge latency_s)
  lag_correct: true         # measure the remaining lag per session by cross-correlation and correct before pairing (2026-10-05 user request)
  lag_min_r: 0.8            # no correction if the correlation is below this
  simultaneous_ratio: 0.5   # HAND simultaneous contact threshold
  hand_order: [A1, A2, B1, B2]   # HAND press order. Label ↔ channel/slot to be added after P1b
